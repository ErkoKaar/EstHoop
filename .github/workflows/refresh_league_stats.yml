name: Refresh league stats

# Liiga protsentiilide jaoks kraabitakse iga meeskonna leht (~170 päringut),
# seega mitte iga öö: ProBallers on Cloudflare'i taga ja liiga suur päringute
# hulk võib blokeeringu käivitada ka igaöisele refresh_club_stats'ile.
# 02:00 refresh_club_stats peab olema enne läbi, sealt tulevad liigad.

on:
  schedule:
    - cron: '0 3 * * 1,3,5'  # E, K, R kell 05:00 Eesti aja järgi (UTC+2)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Refresh league stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/migrations/23_refresh_league_stats.py
