name: Keep backend awake

# Render tasuta plaan paneb teenuse 15 minuti jõudeoleku järel magama ja
# äratamine võtab ~50 sekundit. Leht ise avaneb kohe, sest HTML on eelrenderdatud,
# aga statistika ja mängude numbrid ilmuvad alles pärast äratust.
#
# TÄPSUS: GitHubi ajastus ei ole garanteeritud. Suure koormuse ajal võib käivitus
# hilineda 10-30 minutit, mis tähendab, et backend jõuab vahepeal magama jääda.
# Kui tahad usaldusväärset pingimist, kasuta selle asemel tasuta välist teenust
# (cron-job.org või UptimeRobot), mis laseb 5 minuti täpsusega.
#
# GitHub lülitab ajastatud töövood välja, kui repos pole 60 päeva tegevust olnud.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Kui eelmine ping veel käib, pole mõtet teist kõrvale käivitada
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend
        run: |
          URL="https://esthoop-backend.onrender.com/players"

          # Külmkäivitus võtab ~50 s, seepärast pikk timeout ja kolm katset
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
                        --max-time 120 --retry 2 --retry-delay 15 "$URL" || echo "000")

          echo "HTTP $status"

          if [ "$status" != "200" ]; then
            echo "Backend ei vastanud ootuspäraselt"
            exit 1
          fi
