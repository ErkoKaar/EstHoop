name: Refresh national team data

# Mängude aknas käiakse tihedalt, et boxscore jõuaks lehele juba samal õhtul.
#
# MIKS KORDUS, MITTE ÜKS KÄIK PÄRAST MÄNGU: scrape_fiba_box_scores nõuab, et
# mängijate punktisumma klapiks täpselt lõppskooriga (scraper.py). FIBA
# mängijastatistika jõuab lõppskoorile järele ebaühtlase viitega, seega üks
# käivitus võib tabada hetke, mil andmed on veel poolikud. Mäng jääb siis
# have_box nimekirjast välja ja järgmine käivitus proovib ise uuesti.
#
# HIND: repo on privaatne, ehk Actionsi minutid on piiratud (2000 kuus Free
# plaaniga). Üks käivitus kestab ~70 s ja arveldatakse kahe minutina, seega
# aken 16-22 UTC teeb ~840 minutit kuus. Akna laiendamisel arvesta sellega.

on:
  schedule:
    - cron: '*/30 16-22 * * *'  # 18:00-00:30 Eesti aja järgi (suveajal tund hiljem) — mängujärgne aken
    - cron: '0 4 * * *'         # Kell 06:00 Eesti aja järgi — varuvõrk aknast välja jäänud mängudele
  workflow_dispatch:

# Kaks käivitust ei tohi sama cache'i korraga kirjutada
concurrency:
  group: refresh-national-team
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Refresh national team data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/migrations/09_refresh_national_team.py
