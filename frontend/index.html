<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <!--
      Ruudukujulised, sest Google võtab favikooni otsingutulemusse ainult
      kuvasuhtega 1:1 ja 48 piksli kordse mõõduga. logo/logo.png on 300x250.
      Failid tulevad skriptist scripts/generate-brand-assets.py.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0072ce" />
    <!--
      title, description, canonical ja og:*/twitter:* tulevad src/components/Seo.jsx-ist.
      React 19 tõstab need <head>-i — siin dubleerituna jääks brauseril ja Google'il
      kehtima staatiline (vale) variant.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
